<?xml version="1.0" encoding="UTF-8"?>
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wsSlab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="wsBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="wsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo redondeado, gradiente grafito -->
  <rect width="140" height="140" rx="30" fill="url(#wsBg)"/>
  <circle cx="116" cy="20" r="46" fill="#ffffff" opacity="0.06"/>

  <!-- Placa de mármol con veta -->
  <g filter="url(#wsShadow)">
    <rect x="20" y="34" width="100" height="52" rx="7" fill="url(#wsSlab)"/>
    <!-- canto inferior de la placa -->
    <path d="M20 79h100v0a7 7 0 0 1-7 7H27a7 7 0 0 1-7-7z" fill="#cbd5e1"/>
    <!-- vetas -->
    <path d="M32 34c8 10 4 18 14 26s6 16 12 26" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <path d="M62 34c6 8 14 8 18 18s12 12 14 20" fill="none" stroke="#b6c2d4" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M97 34c3 6 9 8 12 14" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <!-- línea de corte -->
    <rect x="83.4" y="52" width="3.2" height="34" rx="1.6" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Disco de corte diamantado -->
  <g filter="url(#wsShadow)">
    <circle cx="85" cy="94" r="26" fill="url(#wsBlade)"/>
    <!-- dientes -->
    <g fill="#b45309">
      <path d="M85 66l4 7h-8z"/>
      <path d="M85 122l4-7h-8z"/>
      <path d="M57 94l7-4v8z"/>
      <path d="M113 94l-7-4v8z"/>
      <path d="M65.2 74.2l7.8 2.1-5.7 5.7z"/>
      <path d="M104.8 113.8l-7.8-2.1 5.7-5.7z"/>
      <path d="M104.8 74.2l-2.1 7.8-5.7-5.7z"/>
      <path d="M65.2 113.8l2.1-7.8 5.7 5.7z"/>
    </g>
    <!-- ranuras del disco -->
    <g stroke="#b45309" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M85 76v9"/>
      <path d="M85 103v9"/>
      <path d="M67 94h9"/>
      <path d="M94 94h9"/>
    </g>
    <!-- eje -->
    <circle cx="85" cy="94" r="7.5" fill="#fef3c7"/>
    <circle cx="85" cy="94" r="3.2" fill="#92400e"/>
  </g>

  <!-- Chispas del corte -->
  <g stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round">
    <path d="M60 70l-7-7"/>
    <path d="M56 79l-9-3"/>
    <path d="M65 63l-3-9"/>
  </g>
</svg>
